<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - E-Bake Ingredients</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-color: #6366f1;
        --primary-dark: #4f46e5;
        --success-color: #10b981;
        --danger-color: #ef4444;
        --border-color: #e5e7eb;
        --bg-light: #f9fafb;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1),
          0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1),
          0 8px 10px -6px rgb(0 0 0 / 0.1);
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding-bottom: 3rem;
      }

      .container {
        padding-top: 2rem;
        padding-bottom: 2rem;
      }

      .register-wrapper {
        width: 100%;
        animation: fadeInUp 0.6s ease-out;
      }

      .register-card {
        background: white;
        border-radius: 24px;
        padding: 3rem;
        box-shadow: var(--shadow-xl);
        border: none;
        position: relative;
        overflow: hidden;
      }

      .register-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(
          90deg,
          var(--primary-color) 0%,
          var(--primary-dark) 50%,
          #8b5cf6 100%
        );
      }

      .register-header {
        text-align: center;
        margin-bottom: 2.5rem;
      }

      .register-header h2 {
        font-size: 2rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }

      .register-header h2 i {
        color: var(--primary-color);
        font-size: 1.75rem;
      }

      .register-header p {
        color: #6b7280;
        font-size: 0.95rem;
        margin: 0;
      }

      .section-divider {
        display: flex;
        align-items: center;
        margin: 2rem 0 1.5rem;
        gap: 1rem;
      }

      .section-divider::before {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--border-color));
      }

      .section-divider::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(90deg, var(--border-color), transparent);
      }

      .section-divider span {
        color: #6b7280;
        font-weight: 600;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .section-divider i {
        color: var(--primary-color);
      }

      .alert {
        border-radius: 12px;
        border: none;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        animation: slideDown 0.4s ease-out;
        font-weight: 500;
        border-left: 4px solid var(--danger-color);
        background: #fee2e2;
        color: #991b1b;
      }

      .alert::before {
        content: "\f06a";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 1.25rem;
        color: var(--danger-color);
      }

      .form-label {
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .form-label i {
        color: var(--primary-color);
        font-size: 0.875rem;
      }

      .form-control {
        border: 2px solid var(--border-color);
        border-radius: 12px;
        padding: 0.875rem 1.125rem;
        transition: all 0.3s ease;
        font-size: 0.95rem;
        background: #fafafa;
      }

      .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        background: white;
        transform: translateY(-1px);
      }

      .form-control:hover {
        border-color: #d1d5db;
      }

      .form-control.is-invalid {
        border-color: var(--danger-color);
        background: #fef2f2;
      }

      .gender-group {
        display: flex;
        gap: 2rem;
        padding: 0.75rem 0;
      }

      .form-check {
        padding-left: 0;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .form-check-input {
        width: 1.35rem;
        height: 1.35rem;
        border: 2px solid var(--border-color);
        cursor: pointer;
        transition: all 0.3s ease;
        margin: 0;
      }

      .form-check-input[type="radio"] {
        border-radius: 50%;
      }

      .form-check-input:checked {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
      }

      .form-check-input:focus {
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      }

      .form-check-label {
        font-weight: 500;
        color: #4b5563;
        cursor: pointer;
        margin: 0;
        font-size: 0.95rem;
      }

      .text-danger.small {
        font-size: 0.8rem;
        margin-top: 0.35rem;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-weight: 500;
      }

      .text-danger.small::before {
        content: "\f071";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 0.75rem;
      }

      .btn {
        padding: 0.875rem 1.5rem;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--primary-color) 0%,
          var(--primary-dark) 100%
        );
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        background: linear-gradient(
          135deg,
          var(--primary-dark) 0%,
          #4338ca 100%
        );
        color: white;
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .register-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 2px solid var(--border-color);
      }

      .register-footer p {
        margin: 0;
        color: #6b7280;
        font-size: 0.95rem;
      }

      .register-footer a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        position: relative;
      }

      .register-footer a:hover {
        color: var(--primary-dark);
      }

      .register-footer a::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--primary-color);
        transition: width 0.3s ease;
      }

      .register-footer a:hover::after {
        width: 100%;
      }

      .input-group-icon {
        position: relative;
      }

      .input-group-icon .form-control {
        padding-left: 2.75rem;
      }

      .input-group-icon i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        z-index: 10;
      }

      .password-strength {
        height: 4px;
        background: var(--border-color);
        border-radius: 2px;
        margin-top: 0.5rem;
        overflow: hidden;
        display: none;
      }

      .password-strength-bar {
        height: 100%;
        width: 0;
        transition: all 0.3s ease;
        border-radius: 2px;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive */
      @media (max-width: 768px) {
        .register-card {
          padding: 2rem 1.5rem;
          border-radius: 20px;
        }

        .register-header h2 {
          font-size: 1.5rem;
        }

        .register-header h2 i {
          font-size: 1.375rem;
        }

        .gender-group {
          gap: 1.5rem;
        }
      }

      @media (max-width: 576px) {
        .container {
          padding-left: 1rem;
          padding-right: 1rem;
        }

        .register-card {
          padding: 1.75rem 1.25rem;
        }

        .gender-group {
          flex-direction: column;
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <th:block th:replace="~{common/layout :: header}"></th:block>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
          <div class="register-wrapper">
            <div class="register-card">
              <div class="register-header">
                <h2>
                  <i class="fas fa-user-plus"></i>
                  Create Account
                </h2>
                <p>Join us today! Fill in the details below to get started</p>
              </div>

              <div
                th:if="${errMsg}"
                class="alert alert-danger"
                role="alert"
                th:text="${errMsg}"
              >
                Error message here
              </div>

              <form
                id="registerForm"
                th:action="@{/auth/register}"
                th:object="${account}"
                method="post"
                novalidate
              >
                <!-- Personal Information -->
                <div class="section-divider">
                  <span>
                    <i class="fas fa-id-card"></i>
                    Personal Information
                  </span>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="firstName" class="form-label">
                      <i class="fas fa-user"></i>
                      First Name
                    </label>
                    <input
                      type="text"
                      class="form-control"
                      id="firstName"
                      th:field="*{profile.firstName}"
                      placeholder="Enter first name"
                      required
                    />
                    <div class="text-danger small" id="error-firstName"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="lastName" class="form-label">
                      <i class="fas fa-user"></i>
                      Last Name
                    </label>
                    <input
                      type="text"
                      class="form-control"
                      id="lastName"
                      th:field="*{profile.lastName}"
                      placeholder="Enter last name"
                      required
                    />
                    <div class="text-danger small" id="error-lastName"></div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="phone" class="form-label">
                    <i class="fas fa-phone"></i>
                    Phone Number
                  </label>
                  <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    th:field="*{profile.phoneNumber}"
                    placeholder="Enter phone number (e.g., 0912345678)"
                    required
                  />
                  <div class="text-danger small" id="error-phone"></div>
                </div>

                <div class="mb-3">
                  <label class="form-label">
                    <i class="fas fa-venus-mars"></i>
                    Gender
                  </label>
                  <div class="gender-group">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        id="male"
                        name="gender"
                        th:field="*{profile.gender}"
                        value="true"
                      />
                      <label class="form-check-label" for="male">
                        <i class="fas fa-mars"></i> Male
                      </label>
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        id="female"
                        name="gender"
                        th:field="*{profile.gender}"
                        value="false"
                      />
                      <label class="form-check-label" for="female">
                        <i class="fas fa-venus"></i> Female
                      </label>
                    </div>
                  </div>
                  <div class="text-danger small" id="error-gender"></div>
                </div>

                <div class="mb-3">
                  <label for="dob" class="form-label">
                    <i class="fas fa-calendar-alt"></i>
                    Date of Birth
                  </label>
                  <input
                    type="date"
                    class="form-control"
                    id="dob"
                    th:field="*{profile.dob}"
                    required
                  />
                  <div class="text-danger small" id="error-dob"></div>
                </div>

                <!-- Account Information -->
                <div class="section-divider">
                  <span>
                    <i class="fas fa-lock"></i>
                    Account Security
                  </span>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">
                    <i class="fas fa-envelope"></i>
                    Email Address
                  </label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    th:field="*{email}"
                    placeholder="your.email@example.com"
                    required
                  />
                  <div class="text-danger small" id="error-email"></div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">
                    <i class="fas fa-key"></i>
                    Password
                  </label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    th:field="*{password}"
                    placeholder="Create a strong password"
                    required
                  />
                  <div class="password-strength" id="passwordStrength">
                    <div class="password-strength-bar"></div>
                  </div>
                  <div class="text-danger small" id="error-password"></div>
                </div>

                <div class="mb-4">
                  <label for="confirmPassword" class="form-label">
                    <i class="fas fa-check-double"></i>
                    Confirm Password
                  </label>
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                  />
                  <div
                    class="text-danger small"
                    id="error-confirmPassword"
                  ></div>
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                  </button>
                </div>
              </form>

              <div class="register-footer">
                <p>
                  Already have an account?
                  <a th:href="@{/auth/login}">
                    <i class="fas fa-sign-in-alt"></i>
                    Login here
                  </a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <th:block th:replace="~{common/layout :: footer}"></th:block>

    <script>
      // Password strength indicator
      document
        .getElementById("password")
        .addEventListener("input", function (e) {
          const password = e.target.value;
          const strengthBar = document.querySelector(".password-strength-bar");
          const strengthContainer = document.getElementById("passwordStrength");

          if (password.length > 0) {
            strengthContainer.style.display = "block";

            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (/[a-z]/.test(password)) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/\d/.test(password)) strength += 12.5;
            if (/[@$!%*?&]/.test(password)) strength += 12.5;

            strengthBar.style.width = strength + "%";

            if (strength < 50) {
              strengthBar.style.background = "#ef4444";
            } else if (strength < 75) {
              strengthBar.style.background = "#f59e0b";
            } else {
              strengthBar.style.background = "#10b981";
            }
          } else {
            strengthContainer.style.display = "none";
          }
        });

      document
        .getElementById("registerForm")
        .addEventListener("submit", function (e) {
          let valid = true;

          // Xóa lỗi cũ và class is-invalid
          document
            .querySelectorAll(".text-danger")
            .forEach((el) => (el.textContent = ""));
          document
            .querySelectorAll(".form-control")
            .forEach((el) => el.classList.remove("is-invalid"));

          const firstName = document.getElementById("firstName").value.trim();
          const lastName = document.getElementById("lastName").value.trim();
          const phone = document.getElementById("phone").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const dob = document.getElementById("dob").value;
          const genderMale = document.getElementById("male").checked;
          const genderFemale = document.getElementById("female").checked;

          const phoneRegex = /^(?:\+84|0)(3|5|7|8|9)[0-9]{8}$/;
          const nameRegex = /^[A-Za-zÀ-ỹ\s'-]{1,50}$/;
          const emailRegex = /^[\w.-]+@[\w.-]+\.[A-Za-z]{2,6}$/;
          const passwordRegex =
            /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

          if (!nameRegex.test(firstName)) {
            valid = false;
            document.getElementById("firstName").classList.add("is-invalid");
            document.getElementById("error-firstName").textContent =
              "First name contains invalid characters";
          }
          if (!nameRegex.test(lastName)) {
            valid = false;
            document.getElementById("lastName").classList.add("is-invalid");
            document.getElementById("error-lastName").textContent =
              "Last name contains invalid characters";
          }
          if (!phoneRegex.test(phone)) {
            valid = false;
            document.getElementById("phone").classList.add("is-invalid");
            document.getElementById("error-phone").textContent =
              "Phone number must be a valid Vietnamese number";
          }
          if (!emailRegex.test(email)) {
            valid = false;
            document.getElementById("email").classList.add("is-invalid");
            document.getElementById("error-email").textContent =
              "Email format is invalid";
          }
          if (!passwordRegex.test(password)) {
            valid = false;
            document.getElementById("password").classList.add("is-invalid");
            document.getElementById("error-password").textContent =
              "Password must be 8+ chars, include upper, lower, number, and special character";
          }
          if (password !== confirmPassword) {
            valid = false;
            document
              .getElementById("confirmPassword")
              .classList.add("is-invalid");
            document.getElementById("error-confirmPassword").textContent =
              "Passwords do not match";
          }
          if (!genderMale && !genderFemale) {
            valid = false;
            document.getElementById("error-gender").textContent =
              "Please select gender";
          }
          if (!dob) {
            valid = false;
            document.getElementById("dob").classList.add("is-invalid");
            document.getElementById("error-dob").textContent =
              "Date of birth is required";
          } else {
            const dobDate = new Date(dob);
            const today = new Date();
            if (dobDate >= today) {
              valid = false;
              document.getElementById("dob").classList.add("is-invalid");
              document.getElementById("error-dob").textContent =
                "Date of birth must be in the past";
            }
          }

          if (!valid) {
            e.preventDefault();
            // Scroll to first error
            const firstError = document.querySelector(".is-invalid");
            if (firstError) {
              firstError.scrollIntoView({
                behavior: "smooth",
                block: "center",
              });
            }
          }
        });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
