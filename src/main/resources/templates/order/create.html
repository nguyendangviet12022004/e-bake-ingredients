<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create order - E-Bake Ingredients</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .product-img { width: 80px; height: 80px; object-fit: cover; }
  </style>
</head>
<body>
  <th:block th:replace="~{common/layout :: header}"></th:block>

  <div class="container mt-4">
    <h4>Create Order</h4>

    <div class="row">
      <div class="col-md-8">
        <div class="card mb-3">
          <div class="card-header">Items</div>
          <div class="card-body">
            <div th:if="${draft.items == null or #lists.isEmpty(draft.items)}" class="alert alert-info">
              No items selected.
            </div>
            <div th:each="item : ${draft.items}">
              <div class="d-flex align-items-center mb-2">
                <img th:if="${item.product.images != null and !#lists.isEmpty(item.product.images)}" th:src="${item.product.images[0].src}" class="product-img me-3" />
                <img th:unless="${item.product.images != null and !#lists.isEmpty(item.product.images)}" th:src="@{/images/default-product.jpg}" class="product-img me-3" />
                <div>
                  <div th:text="${item.product.name}">Product name</div>
                  <small class="text-muted" th:text="'Qty: ' + ${item.quantity}">Qty</small>
                </div>
                <div class="ms-auto fw-bold" th:text="${#numbers.formatDecimal(item.subtotal,0,'COMMA',2,'POINT')}">$0.00</div>
              </div>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header">Shipping address</div>
          <div class="card-body">
            <form th:action="@{/order/create}" th:object="${createDto}" method="post">
              <div th:each="addr : ${addresses}">
                <div class="form-check mb-2">
                  <input class="form-check-input" type="radio" th:field="*{addressId}" th:value="${addr.id}" th:id="${'addr-' + addr.id}" />
                  <label class="form-check-label" th:for="${'addr-' + addr.id}">
                    <strong th:text="${addr.fullName}">Name</strong> - <span th:text="${addr.phoneNumber}">Phone</span><br/>
                    <span th:text="${addr.addressLine + (addr.ward != null ? ', ' + addr.ward : '') + (addr.district != null ? ', ' + addr.district : '') + (addr.city != null ? ', ' + addr.city : '')}">Full address</span>
                    <span class="badge bg-success ms-2" th:if="${addr.isDefault}">Default</span>
                  </label>
                </div>
              </div>

              <div class="mt-3">
                <div class="mb-2">Payment method</div>
                <div th:each="pm : ${paymentMethods}">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" th:field="*{paymentMethod}" th:value="${pm.name()}" th:id="${'pm-' + pm.name()}" />
                    <label class="form-check-label" th:for="${'pm-' + pm.name()}" th:text="${pm.name()}">PM</label>
                  </div>
                </div>
              </div>

              <!-- include selected ids as hidden inputs -->
              <div th:if="${createDto.selectedItemIds != null}">
                <input type="hidden" th:each="id : ${createDto.selectedItemIds}" name="selectedItemIds" th:value="${id}" />
              </div>

              <div class="mt-4 d-flex justify-content-between align-items-center">
                <div>
                  <small class="text-muted">Order total</small>
                  <div class="fs-5 fw-bold" th:text="${#numbers.formatDecimal(draft.total,0,'COMMA',2,'POINT')}">$0.00</div>
                </div>
                <button class="btn btn-primary" type="submit">Place order</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h6>Order summary</h6>
            <div class="d-flex justify-content-between">
              <div>Items</div>
              <div th:text="${draft.items.size()}">0</div>
            </div>
            <div class="d-flex justify-content-between mt-2">
              <div>Total</div>
              <div class="fw-bold" th:text="${#numbers.formatDecimal(draft.total,0,'COMMA',2,'POINT')}">$0.00</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <th:block th:replace="~{common/layout :: footer}"></th:block>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
